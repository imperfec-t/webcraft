name: ci
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        # Python 3.9 is end-of-life and has no build for the newest Ubuntu image;
        # keep testing the minimum supported version on Ubuntu 24.04.
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: webcraft validate
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: CLI smoke test
        run: |
          webcraft tokens "#e4572e" --tone editorial -o tokens.css
          webcraft contrast --tokens tokens.css
          webcraft install claude --scope project --dry-run
          webcraft audit examples/sample-site --fail-on never
