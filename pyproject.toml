[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "webcraft-skills"
version = "0.1.0"
description = "Website-design skills and deterministic checks (tokens, contrast, launch QA, teardown) for Claude Code, Codex, Gemini CLI, Copilot, Cursor and any MCP client."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "webcraft contributors" }]
keywords = ["agent-skills", "claude-code", "codex", "mcp", "web-design", "design-tokens", "accessibility", "seo", "wcag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Site Management",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# Use the operating system's certificate store when auditing live sites.
tls = ["truststore>=0.9; python_version >= '3.10'"]

[project.scripts]
webcraft = "webcraft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/webcraft"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "webcraft/skills"
"prompts" = "webcraft/prompts"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "prompts", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]
